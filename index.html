<script>
var names={html:"HTML",css:"CSS",js:"JavaScript",py:"Python"};
var src={
html:'<h1>Namaste Duniya</h1>\n<p>Ye mera pehla code hai.</p>',
css:'body{font-family:sans-serif;text-align:center}\nh1{color:crimson}\nbutton{padding:8px 16px}',
js:'',
py:'naam = "Code Runner G"\nprint("Namaste", naam)\nfor i in range(3):\n    print("Number", i + 1)'};
var cur="html";
var $=function(i){return document.getElementById(i)};
var ta=$("code"),ln=$("ln");

function tabs(){
  $("tabs").innerHTML="";
  Object.keys(names).forEach(function(k){
    var b=document.createElement("button");
    b.className="tab"+(k==cur?" on":"");b.textContent=names[k];
    b.onclick=function(){src[cur]=ta.value;cur=k;ta.value=src[k];tabs();nums()};
    $("tabs").appendChild(b);
  });
}
function nums(){
  var n=ta.value.split("\n").length,s="";
  for(var i=1;i<=n;i++)s+=i+"\n";
  ln.textContent=s;ln.scrollTop=ta.scrollTop;
}
ta.addEventListener("input",nums);
ta.addEventListener("scroll",function(){ln.scrollTop=ta.scrollTop});

function pyRun(lines,vars,out){
  for(var i=0;i<lines.length;i++){
    var l=lines[i];if(!l.trim()||l.trim()[0]=="#")continue;
    var t=l.trim(),m;
    if(m=t.match(/^for (\w+) in range\((.+)\):$/)){
      var body=[];
      while(i+1<lines.length&&(/^\s+/.test(lines[i+1])||!lines[i+1].trim())){body.push(lines[++i].replace(/^(\t|    )/,""))}
      var n=pyEval(m[2],vars);
      for(var k=0;k<n;k++){vars[m[1]]=k;pyRun(body,vars,out)}
    }else if(m=t.match(/^print\((.*)\)$/)){
      out.push(pyEval("["+m[1]+"]",vars).join(" "));
    }else if(m=t.match(/^(\w+)\s*=\s*(.+)$/)){
      vars[m[1]]=pyEval(m[2],vars);
    }else throw new Error("Samajh nahi aaya: "+t);
  }
}
function pyEval(e,vars){
  var keys=Object.keys(vars);
  return Function.apply(null,keys.concat("return ("+e.replace(/\bTrue\b/g,"true").replace(/\bFalse\b/g,"false")+")")).apply(null,keys.map(function(k){return vars[k]}));
}
function runPy(code){
  var out=[];
  try{pyRun(code.split("\n"),{},out)}catch(e){out.push("Error: "+e.message)}
  return out.join("\n");
}

function run(){
  src[cur]=ta.value;
  var con=$("con");
  con.textContent=cur=="py"?runPy(src.py):"";
  $("out").srcdoc='<style>'+src.css+'</style>'+src.html+
   '<script>console.log=function(){parent.postMessage({log:[].slice.call(arguments).join(" ")},"*")};window.onerror=function(m){parent.postMessage({log:"Error: "+m},"*")};<\/script><script>'+src.js.replace(/<\/script/gi,"<\\/script")+'<\/script>';
}
window.addEventListener("message",function(e){
  if(e.data&&e.data.log!==undefined){var c=$("con");c.textContent+=(c.textContent?"\n":"")+e.data.log}
});
$("run").onclick=run;

function show(l){
  $("ovt").textContent=names[l]+" ke Tags ("+D[l].split("\n").length+")";
  var tb=$("tb");tb.innerHTML="";
  D[l].split("\n").forEach(function(s){
    var f=s.replace(/\\n/g,"\n").replace(/\\\//g,"/").split("|"),name=f[0],kaam=f[1],ex=f[2]||"",res=f[3]||"",code,how,vis;
    if(l=="html"){code="<"+name+">";how=ex||"<"+name+">Text</"+name+">";vis=how}
    else if(l=="css"){code=name+":"+ex+";";how="selector{"+name+":"+ex+";}";vis='<div style="border:1px dashed #999;padding:4px;'+name+':'+ex+'"><b>A</b> <b>B</b> <b>C</b> text</div>'}
    else{code=name;how=ex;vis=res}
    var tr=document.createElement("tr");
    [code,how].forEach(function(t){var td=document.createElement("td"),c=document.createElement("code");c.textContent=t;td.appendChild(c);tr.appendChild(td)});
    var td=document.createElement("td");td.textContent=kaam;tr.appendChild(td);
    td=document.createElement("td");
    if(l=="html"||l=="css"){var fr=document.createElement("iframe");fr.setAttribute("sandbox","");fr.srcdoc="<body style='font:13px sans-serif;margin:6px'>"+vis;td.appendChild(fr)}
    else{var c=document.createElement("code");c.textContent=vis;td.appendChild(c)}
    tr.appendChild(td);tb.appendChild(tr);
  });
  $("ov").classList.add("open");$("menu").classList.remove("open");
}
$("tagBtn").onclick=function(){$("menu").classList.toggle("open")};
document.querySelectorAll("#menu button").forEach(function(b){b.onclick=function(){show(b.dataset.l)}});
$("x").onclick=function(){$("ov").classList.remove("open")};
